server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    discovery:
      reactive:
        enabled: true

    gateway:
      
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        # USER ACTUATOR
        - id: user-actuator
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/actuator/**
          filters:
            - StripPrefix=2

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**

        # AUTH ACTUATOR
        - id: auth-actuator
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/actuator/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

